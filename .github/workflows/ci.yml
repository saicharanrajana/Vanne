name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# A superseded run on the same branch/PR is dead work: cancel it instead of
# paying for a full Gradle build nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  # Analysis and every offline test suite. This job needs no Android toolchain,
  # so it generally finishes before the APK build does and reports failures
  # earlier.
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: false

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # One resolution for the whole pub workspace (root plus packages/*); every
      # later command passes --no-pub so it does not resolve again.
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run app tests
        run: flutter test --no-pub

      # Root `flutter test` only discovers the root test/ directory. These
      # workspace packages carry the transport and platform-channel contracts
      # (auth, cache, rate limits, parsing, error mapping, MethodChannel
      # behavior), which the app-level fakes deliberately bypass. The live
      # Wallhaven suite stays opt-in via WALLHAVEN_LIVE=1 and is skipped here.
      - name: Run wallhaven_client tests
        working-directory: packages/wallhaven_client
        run: dart test

      - name: Run system_wallpaper tests
        working-directory: packages/system_wallpaper
        run: flutter test --no-pub

  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          problem-matcher: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: false

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # The runner image does not ship the NDK the pinned Flutter version asks
      # for, so the release build downloads and unpacks it on every run. Read
      # the version from Flutter's own Gradle plugin rather than copying a
      # number here: upgrading Flutter then invalidates this cache instead of
      # silently restoring the wrong NDK, and an unreadable plugin fails loudly
      # instead of guessing.
      - name: Resolve Android NDK version
        id: ndk
        run: |
          set -euo pipefail
          ext="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"
          version=""
          if [ -f "$ext" ]; then
            version="$(sed -n 's/.*val ndkVersion: String = "\([^"]*\)".*/\1/p' "$ext" | head -n 1)"
          fi
          if [ -z "$version" ]; then
            echo "::error::Could not read ndkVersion from $ext; refusing to guess an NDK version."
            exit 1
          fi
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK location is not set}}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=$sdk/ndk/$version" >> "$GITHUB_OUTPUT"
          echo "Using Android NDK $version from $sdk/ndk/$version"

      - name: Cache Android NDK
        uses: actions/cache@v5
        with:
          path: ${{ steps.ndk.outputs.dir }}
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}

      # Resolved dependencies, the Gradle distribution and artifact transforms
      # dominate a warm build. Project build outputs are deliberately excluded.
      # The exact key follows Gradle/AGP/Kotlin configuration; the broad restore
      # prefix may also restore compatible dependencies across config changes.
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/settings.gradle.kts', 'android/build.gradle.kts', 'android/app/build.gradle.kts', 'android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        # Signing config falls back to the debug keystore in CI; the signed
        # artifacts are produced by the release workflow.
        run: flutter build apk --release --no-pub

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: vanne-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # Keeps the workflow's historical job/check name as the single required
  # status, so existing branch protection keeps working while `quality` and
  # `apk` run in parallel. Both must succeed for this gate to pass.
  build:
    name: Analyze, test and build APK
    if: always()
    needs: [quality, apk]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required job results
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          APK_RESULT: ${{ needs.apk.result }}
        run: |
          set -euo pipefail
          printf 'quality=%s\napk=%s\n' "$QUALITY_RESULT" "$APK_RESULT"
          for result in "$QUALITY_RESULT" "$APK_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job did not succeed (result: $result)."
              exit 1
            fi
          done
