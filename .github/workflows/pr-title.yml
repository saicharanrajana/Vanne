name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  check:
    name: Check PR title follows Conventional Commits
    # Squash-merged PR titles become the commit message on main, which
    # release-please parses to generate the changelog.
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|chore|refactor|test|style|perf|build|ci|revert)(\([a-zA-Z0-9_-]+\))?(!)?: .+'; then
            echo "PR title does not follow Conventional Commits: $TITLE"
            echo "Expected: <type>(<optional scope>)!: <description>"
            echo "Allowed types: feat fix docs chore refactor test style perf build ci revert"
            exit 1
          fi
          if [ "$(printf '%s' "$TITLE" | wc -c)" -gt 72 ]; then
            echo "PR title is longer than 72 characters: $TITLE"
            exit 1
          fi
