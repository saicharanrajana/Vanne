name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    name: Build and attach signed APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/vanne-upload.jks

      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storeFile=vanne-upload.jks
          keyAlias=$KEY_ALIAS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi --target-platform=android-arm,android-arm64

      - name: Build universal APK
        run: flutter build apk --release

      - name: Rename APKs and generate checksums
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/vanne-${GITHUB_REF_NAME#v}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "dist/vanne-${GITHUB_REF_NAME#v}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/vanne-${GITHUB_REF_NAME#v}-universal.apk"
          cd dist
          shasum -a 256 *.apk > SHA256SUMS.txt

      - name: Attach APKs to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vanne-*-arm64-v8a.apk
            dist/vanne-*-armeabi-v7a.apk
            dist/vanne-*-universal.apk
            dist/SHA256SUMS.txt

      - name: Clean up signing secrets
        if: always()
        run: |
          rm -f android/app/vanne-upload.jks
          rm -f android/key.properties
