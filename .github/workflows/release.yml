name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach (e.g. v0.1.0)"
        required: true
  # Called from the release-please workflow right after a release is cut.
  # release-please creates the tag with the default GITHUB_TOKEN, and events
  # triggered by that token do not start new workflow runs — so the tag push
  # alone would never reach the `push: tags` trigger. Reuse-as-job sidesteps
  # the recursion rule entirely.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  apk:
    name: Build and attach signed APKs
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/vanne-upload.jks

      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storeFile=vanne-upload.jks
          keyAlias=$KEY_ALIAS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi --target-platform=android-arm,android-arm64

      - name: Build universal APK
        run: flutter build apk --release

      - name: Rename APKs and generate checksums
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/vanne-${TAG#v}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "dist/vanne-${TAG#v}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/vanne-${TAG#v}-universal.apk"
          cd dist
          shasum -a 256 ./*.apk > SHA256SUMS.txt

      - name: Write download guide
        run: |
          cat > dist/apk_table.md << EOF

          ---

          ### Which APK do I download?

          | File | For |
          |------|-----|
          | \`vanne-${TAG#v}-arm64-v8a.apk\` | **Recommended** — nearly all Android phones (2017+) |
          | \`vanne-${TAG#v}-armeabi-v7a.apk\` | Older 32-bit devices |
          | \`vanne-${TAG#v}-universal.apk\` | Unsure? Emulators and Chromebooks too |

          Verify downloads against \`SHA256SUMS.txt\`.
          EOF

      # gh CLI instead of softprops/action-gh-release: that action PATCHes the
      # release with an explicit target_commitish on every update, and GitHub
      # rejects PATCHes (and creates) whose resolved target commit touches
      # .github/workflows/ with GITHUB_TOKEN — which never has the workflows
      # permission. Any `ci:` commit folded into a release would then fail the
      # attach. `gh release upload`/`edit` only send the fields being changed,
      # sidestepping the gate without needing a PAT.
      - name: Attach APKs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/vanne-*.apk dist/SHA256SUMS.txt --clobber

      - name: Add the download guide to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json body --jq '.body // ""' > dist/body.md
          # Idempotent: a re-run must not stack a second copy of the table.
          grep -q 'Which APK do I download?' dist/body.md \
            || cat dist/apk_table.md >> dist/body.md
          gh release edit "$TAG" --notes-file dist/body.md

      - name: Clean up signing secrets
        if: always()
        run: |
          rm -f android/app/vanne-upload.jks
          rm -f android/key.properties
