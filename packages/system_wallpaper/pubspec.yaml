name: system_wallpaper
description: Minimal Android wallpaper plugin — home/lock/both + ATTACH_DATA system picker. Built-in Kotlin, no bloat.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.1
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.system_wallpaper
        pluginClass: SystemWallpaperPlugin
