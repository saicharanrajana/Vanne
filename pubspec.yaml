name: vanne
description: "An open-source Android wallpaper application backed by the Wallhaven API."
publish_to: 'none'
version: 0.2.0+3

workspace:
  - packages/wallhaven_client
  - packages/system_wallpaper

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  material_3_expressive: ^1.2.2
  material_ui: ^1.11.1
  collection: ^1.19.1
  # Motion tokens are also transitive through material_3_expressive; keep a
  # direct dependency because app/theme/app_motion.dart imports them.
  motor: ^1.1.0
  auto_route: ^11.1.0
  hive_ce_flutter: ^2.3.4
  flutter_secure_storage: ^11.0.0
  wallhaven_client:
    path: packages/wallhaven_client
  signals: ^7.1.0
  get_it: ^9.2.1
  system_wallpaper:
    path: packages/system_wallpaper
  # Required by the generated lib/l10n code and by GlobalMaterialLocalizations,
  # which pins intl, so the constraint cannot be narrowed here.
  intl: any
  flutter_staggered_grid_view: ^0.7.0
  url_launcher: ^6.3.2
  dio: ^5.11.0
  path_provider: ^2.1.6
  dynamic_color: ^2.1.0
  cached_network_image: ^4.0.6
  flutter_blurhash: ^0.9.1
  flutter_cache_manager: ^3.4.2
  phosphoricons_flutter: ^1.0.0
  # Pinned by the Flutter SDK itself, so a narrower constraint cannot resolve.
  material_color_utilities: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Direct dep for the test harness: FakeCacheManager uses package:file's
  # LocalFileSystem to build FileInfo results for flutter_cache_manager.
  file: ^7.0.1

  flutter_lints: ^6.0.0
  auto_route_generator: ^10.2.3
  build_runner: ^2.16.1
  mocktail: ^1.0.5
  network_image_mock: ^2.1.1

flutter:
  uses-material-design: true

  # Generate localization bindings from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  assets:
    # SIL Open Font License shipped alongside the bundled Outfit font.
    - assets/fonts/OFL.txt
    # Square 400×400 covers for the four curated first-install collections.
    # Provenance and licences: docs/collection-covers.md.
    - assets/collections/

  # Outfit is bundled so the first frame never waits on fonts.gstatic.com.
  # The single variable file carries the wght axis (100–900). Declaring it
  # once per weight the app actually uses lets the engine resolve ordinary
  # `fontWeight` (and `copyWith(fontWeight:)` on theme styles) to the real
  # axis position — no explicit FontVariation that would pin derived styles.
  # Weights outside this list fall back to the nearest declared weight.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Variable.ttf
          weight: 500
        - asset: assets/fonts/Outfit-Variable.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Variable.ttf
          weight: 700
        - asset: assets/fonts/Outfit-Variable.ttf
          weight: 800
